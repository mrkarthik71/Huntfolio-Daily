# Gradle
org.gradle.jvmargs=-Xmx3g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# Application ID for Apex Assistant (Open decision 1: the name is settled).
# Changing the app name is a one-place change here plus the app_name string.
app.id=app.apex.assistant

# Phase flags. A disabled phase has no entry points, receivers, workers or permission requests.
# Phase 0 (Setup) and Phase 1 (Core) are always on, so every flag starts false.
phase.calendar=true
phase.money=true
phase.subscriptions=true
phase.ai=true
phase.email=true
phase.polish=true
