# Builds signed release APKs from a version tag (Requirements 10.4 to 10.7, 65.1, 65.4).
# Secrets (the Secret_Store) required in the repository settings:
#   RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Version code is greater than the last release
        run: ./gradlew :app:verifyVersionCode

      - name: Tests must pass before a release
        run: ./gradlew :app:testPersonalWithSmsDebugUnitTest :app:testSharedSmsFreeDebugUnitTest

      - name: Signing secrets are present
        env:
          KS: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.RELEASE_KEY_ALIAS }}
          KP: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          for v in KS KSP KA KP; do
            if [ -z "${!v}" ]; then echo "Missing signing secret ($v); no release is built."; exit 1; fi
          done

      - name: Write keystore to a temporary file
        env:
          KS: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          KS_PATH="$RUNNER_TEMP/release.jks"
          echo "$KS" | base64 --decode > "$KS_PATH"
          echo "ASSISTANT_KEYSTORE_PATH=$KS_PATH" >> "$GITHUB_ENV"

      - name: Read-only permission check
        run: ./gradlew :app:verifyReadOnlyPermissions

      - name: Assemble signed release APKs
        env:
          ASSISTANT_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          ASSISTANT_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          ASSISTANT_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assemblePersonalWithSmsRelease :app:assembleSharedWithSmsRelease :app:assembleSharedSmsFreeRelease

      - name: Verify APK signatures
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          for apk in app/build/outputs/apk/*/release/*.apk; do
            "$APKSIGNER" verify --verbose "$apk"
          done

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: app/build/outputs/apk/*/release/*.apk

      - name: Delete keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
