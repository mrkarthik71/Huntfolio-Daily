# Runs on every push to any branch and on pull requests (Requirements 10.2, 10.3, 64.5, 64.6).
# Any failing step fails the run.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    runs-on: ubuntu-latest
    needs: secret-scan
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: CLAUDE.md is present
        run: test -s CLAUDE.md

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Static checks (ktlint, detekt, Android Lint)
        run: ./gradlew --no-configuration-cache :app:ktlintCheck :app:detekt :app:lintPersonalWithSmsDebug

      - name: Unit and property tests
        run: ./gradlew :build-logic:convention:test :app:testPersonalWithSmsDebugUnitTest :app:testSharedSmsFreeDebugUnitTest

      - name: Assemble every debug variant
        run: ./gradlew :app:assemblePersonalWithSmsDebug :app:assemblePersonalSmsFreeDebug :app:assembleSharedWithSmsDebug :app:assembleSharedSmsFreeDebug

      - name: Read-only permission check on release manifests
        run: ./gradlew :app:verifyReadOnlyPermissions

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/
            build-logic/convention/build/reports/
          retention-days: 7

  dependency-review:
    # Flags dependencies with known vulnerabilities introduced by a pull request.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
